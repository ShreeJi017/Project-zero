name: ZeroGravity Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools were not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +e
          yes | "$SDKMANAGER" --licenses
          license_status="${PIPESTATUS[1]}"
          set -e
          if [[ "$license_status" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed (sdkmanager exit $license_status)"
            exit "$license_status"
          fi

          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon --stacktrace

      - name: Prepare APK and source ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zerogravity.apk
          git archive --format=zip --prefix=ZeroGravity/ HEAD -o dist/Zerogravtyapp.zip
          test -s dist/zerogravity.apk
          test -s dist/Zerogravtyapp.zip

      - name: Upload app files
        uses: actions/upload-artifact@v4
        with:
          name: ZeroGravity-app-files
          path: |
            dist/zerogravity.apk
            dist/Zerogravtyapp.zip
          if-no-files-found: error
          retention-days: 14
